<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - Contacts Manager</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="center-container">
        <div class="brand">
          <h1 class="brand-title">Contacts Manager</h1>
          <p class="brand-tagline">Your contacts, all in one place.</p>
        </div>
        <div class="card" id="register-card">
            <h1>Register</h1>
            <p class="subtitle">Create your account.</p>

            <form id="register-form">
            <div class="form-group">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" name="firstName" />
            </div>

            <div class="form-group">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" name="lastName" />
            </div>

            <div class="form-group">
                <label for="login">Username</label>
                <input type="text" id="login" name="login" />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" />
            </div>

            <div id="form-message"></div>

            <button type="submit" class="button button-primary">Create Account</button>
            </form>

            <p><a href="login.html">Already have an account? Sign in here</a></p>
        </div>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
