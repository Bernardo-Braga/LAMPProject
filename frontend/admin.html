<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Contacts Manager</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>
<body>

  <header class="topbar">
    <h2>Admin Panel</h2>
    <div class="topbar-right">
      <span id="welcome-message"></span>
      <button id="logout-button" class="button button-secondary">Log Out</button>
    </div>
  </header>

  <main class="page-content">
    <div class="search-row">
      <input type="text" id="search-input" placeholder="Search users..." autocomplete="off" />
    </div>

    <div id="password-form" class="add-form" style="display: none;">
      <div class="form-group">
        <label for="new-password">New Password</label>
        <input type="password" id="new-password" />
      </div>
      <div id="password-message" class="form-message" role="alert" aria-live="polite"></div>
      <div class="form-actions">
        <button id="save-password-button" class="button button-primary">Save Password</button>
        <button id="cancel-password-button" class="button button-secondary">Cancel</button>
      </div>
    </div>

    <div id="users-list"></div>
  </main>

  <script src="js/admin.js"></script>
</body>
</html>
