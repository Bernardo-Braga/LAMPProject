<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Contacts</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⭐</text></svg>">
</head>
<body>

  <header class="topbar">
    <h1 class="topbar-title">Contacts Manager</h1>
    <div class="topbar-right">
      <span id="welcome-message"></span>
      <button type="button" id="logout-button" class="button button-secondary">Log Out</button>
    </div>
  </header>

  <main class="page-content">
    <div class="search-row">
      <label for="search-input" class="visually-hidden">Search contacts</label>
      <input type="search" id="search-input" placeholder="Search contacts..." />
      <label for="sort-select" class="visually-hidden">Sort by</label>
      <select id="sort-select" class="button button-secondary">
        <option value="lastName">Last Name (A-Z)</option>
        <option value="firstName">First Name (A-Z)</option>
        <option value="recent">Recently Added</option>
      </select>
      <button type="button" id="add-contact-button" class="button button-primary" aria-controls="add-contact-form" aria-expanded="false">+ Add Contact</button>
    </div>

    <p id="contact-count" class="subtitle" aria-live="polite"></p>

    <section id="add-contact-form" class="add-form" style="display: none;" aria-labelledby="add-contact-heading">
      <h2 id="add-contact-heading" class="visually-hidden">Add Contact</h2>
      <div class="form-row">
        <div class="form-group">
          <label for="new-firstName">First Name</label>
          <input type="text" id="new-firstName" autocomplete="off" />
        </div>
        <div class="form-group">
          <label for="new-lastName">Last Name</label>
          <input type="text" id="new-lastName" autocomplete="off" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="new-cell">Phone</label>
          <input type="tel" id="new-cell" autocomplete="off" />
        </div>
        <div class="form-group">
          <label for="new-email">Email</label>
          <input type="email" id="new-email" autocomplete="off" />
        </div>
      </div>
      <div id="add-contact-message" class="form-message" role="alert"></div>
      <div class="form-actions">
        <button id="save-contact-button" class="button button-primary">Save Contact</button>
        <button id="cancel-add-button" class="button button-secondary">Cancel</button>
      </div>
    </section>

    <div id="contacts-list"></div>
  </main>

  <div id="confirm-modal" class="modal-overlay" style="display: none;">
    <div class="modal-box" role="alertdialog" aria-modal="true" aria-labelledby="confirm-message">
      <h2 id="confirm-message" class="modal-message"></h2>
      <div class="modal-actions">
        <button id="confirm-yes-button" class="button button-primary">Delete</button>
        <button id="confirm-no-button" class="button button-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <script src="js/contacts.js"></script>
  <script>
    const savedTheme = localStorage.getItem("theme");
    if (savedTheme === "dark") {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  </script>
</body>
</html>
