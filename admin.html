<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Admin - Contacts Manager</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⭐</text></svg>">  
</head>
<body>

  <header class="topbar">
    <h1 class="topbar-title">Admin Panel</h1>
    <div class="topbar-right">
      <span id="welcome-message"></span>
      <button type="button" id="logout-button" class="button button-secondary">Log Out</button>
    </div>
  </header>

  <main class="page-content">
    <div class="tabs" role="tablist" aria-label="Admin sections">
      <button type="button" role="tab" data-tab="users" aria-selected="true">Users</button>
      <button type="button" role="tab" data-tab="stats" aria-selected="false">Statistics</button>
      <button type="button" role="tab" data-tab="audit" aria-selected="false">Audit log</button>
    </div>

    <section id="panel-users">
    <div class="search-row">
      <label for="search-input" class="visually-hidden">Search users</label>
      <input type="search" id="search-input" placeholder="Search users..." autocomplete="off" />
      <label for="sort-select" class="visually-hidden">Sort by</label>
      <select id="sort-select" class="button button-secondary">
        <option value="lastName">Last Name (A-Z)</option>
        <option value="firstName">First Name (A-Z)</option>
        <option value="recent">Recently Added</option>
      </select>
      <label for="role-filter" class="visually-hidden">Filter by role</label>
      <select id="role-filter" class="button button-secondary">
        <option value="all">All Roles</option>
        <option value="Admin">Admins Only</option>
        <option value="User">Regular Users</option>
      </select>
      <select id="status-filter" class="button button-secondary">
        <option value="all">Any Status</option>
        <option value="active">Active</option>
        <option value="disabled">Disabled</option>
        <option value="locked">Locked Out</option>
      </select>
      <button id="new-user-button" class="button button-primary">+ New User</button>
    </div>

    <p id="user-count" class="subtitle" aria-live="polite"></p>

    <section id="password-form" class="add-form" style="display: none;" aria-labelledby="password-form-heading">
      <h2 id="password-form-heading" class="visually-hidden">Change Password</h2>
      <div class="form-group">
        <label for="new-password">New Password</label>

      </div>
      <label class="checkbox"><input type="checkbox" id="must-change-password" checked /> Ask them to choose a new password at next sign-in</label>
      <div id="password-message" class="form-message" role="alert" aria-live="polite"></div>
      <div class="form-actions">
        <button id="save-password-button" class="button button-primary">Save Password</button>
        <button id="cancel-password-button" class="button button-secondary">Cancel</button>
      </div>
    </section>

    <div id="users-list"></div>
    </section>

    <section id="panel-stats" style="display: none;">
      <div id="stat-tiles" class="stats"></div>
      <div class="chart-grid">
        <div class="chart-card"><h3>Sign-ins, last 14 days</h3><div id="chart-logins"></div></div>
        <div class="chart-card"><h3>New accounts, last 30 days</h3><div id="chart-signups"></div></div>
        <div class="chart-card"><h3>Contacts added, last 30 days</h3><div id="chart-contacts"></div></div>
        <div class="chart-card"><h3>Most contacts</h3><div id="chart-top-users"></div></div>
      </div>
      <div class="chart-card"><h3>Most common actions, last 7 days</h3><div id="chart-actions"></div></div>
    </section>

    <section id="panel-audit" style="display: none;">
      <div class="search-row">
        <input type="text" id="audit-search" placeholder="Search text, username or IP..." autocomplete="off" />
        <select id="audit-action" class="button button-secondary">
          <option value="">All Actions</option>
        </select>
      </div>
      <div id="audit-list" class="audit-list"></div>
      <div class="pagination">
        <button id="audit-prev" class="button button-secondary button-small">&larr; Newer</button>
        <span id="audit-page"></span>
        <button id="audit-next" class="button button-secondary button-small">Older &rarr;</button>
      </div>
    </section>
  </main>

  <!-- Create a user or admin -->
  <div id="new-user-modal" class="modal-overlay" style="display: none;">
    <div class="modal-box modal-wide">
      <h3>New user</h3>
      <div class="form-row">
        <div class="form-group"><label for="nu-firstName">First Name</label><input type="text" id="nu-firstName" /></div>
        <div class="form-group"><label for="nu-lastName">Last Name</label><input type="text" id="nu-lastName" /></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label for="nu-login">Username</label><input type="text" id="nu-login" autocomplete="off" /></div>
        <div class="form-group">
          <label for="nu-role">Role</label>
          <select id="nu-role"><option value="User">User</option><option value="Admin">Admin</option></select>
        </div>
      </div>
      <div class="form-group">
        <label for="nu-password">Initial Password</label>
        <input type="text" id="nu-password" autocomplete="off" />
      </div>
      <label class="checkbox"><input type="checkbox" id="nu-must-change" checked /> Ask them to choose their own password at first sign-in</label>
      <div id="new-user-message" class="form-message"></div>
      <div class="modal-actions">
        <button id="new-user-save" class="button button-primary">Create</button>
        <button id="new-user-cancel" class="button button-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <div id="confirm-modal" class="modal-overlay" style="display: none;">
    <div class="modal-box" role="alertdialog" aria-modal="true" aria-labelledby="confirm-message">
      <h2 id="confirm-message" class="modal-message"></h2>
      <div class="modal-actions">
        <button id="confirm-yes-button" class="button button-primary">Disable</button>
        <button id="confirm-no-button" class="button button-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/admin-dashboard.js"></script>
  <script>
    const savedTheme = localStorage.getItem("theme");
    if (savedTheme === "dark") {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  </script>
</body>
</html>
